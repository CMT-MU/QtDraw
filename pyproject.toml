[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qtdraw"
dependencies = [
    "numpy",
    "matplotlib",
    # lower bounds of PySide6, pyvista and pyvistaqt: keep in sync with the "minimum" job in .github/workflows/test.yml.
    "PySide6>=6.9",
    "pyvista>=0.46",
    "pyvistaqt>=0.13",
    "click",
    "pymatgen",
    "multipie>=2",
    "playwright",
]
dynamic = ["version"]
requires-python = ">=3.12"
authors = [
  { name="Hiroaki Kusunose", email="hiroaki.kusunose@gmail.com" },
]
description = "3D drawing tool for molecules and crystals based on Pyvista and PySide6."
readme = {file = "docs/README.md", content-type = "text/markdown"}
keywords = ['pyvista', 'PySide6', 'multipie']
license = {file = "LICENSE"}
classifiers = [
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Visualization',
    'License :: OSI Approved :: MIT License',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: MacOS',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]

[project.urls]
Homepage = "https://github.com/CMT-MU/QtDraw"
Issues = "https://github.com/CMT-MU/QtDraw/issues"

[project.scripts]
"qtdraw" = "qtdraw.scripts.qtdraw:cmd"
"conv_qtdraw3" = "qtdraw.scripts.conv_qtdraw3:cmd"

[project.optional-dependencies]
dev = [
    "black",
    "ipython",
    "jupyter-book<2",
    "ghp-import",
    "pytest",
    "pytest-qt",
    "pytest-xdist",
]

[tool.setuptools.dynamic]
version = {attr = "qtdraw.__version__"}

[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
include = ['qtdraw', 'qtdraw.*']
exclude = ["build", "tests"]

[tool.black]
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.build_sphinx]
source-dir = 'docs'
build-dir  = './docs/_build'
all_files  = 1

[tool.upload_sphinx]
upload-dir = 'docs/_build/html'
